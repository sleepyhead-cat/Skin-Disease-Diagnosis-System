{% extends "layouts/base.html" %}
{% block title %}Add Disease{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-10 mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h2 mb-0">Add Disease</h1>
            <a href="{{ url_for('rules.index') }}" class="btn btn-info text-white rounded-pill px-4">
                Back to Rules
            </a>
        </div>
        <form method="POST" enctype="multipart/form-data">
            {{ form.hidden_tag() }}
            {% include "rules/_form.html" %}
        </form>
    </div>
</div>
{% endblock %}
