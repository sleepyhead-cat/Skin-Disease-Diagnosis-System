{% extends "layouts/base.html" %}

{% block title %}Sign Up{% endblock  %}

{% block content %}

<div class="card border-0 rounded-4 shadow-lg w-100 justify-content-center">
        
    <div class="card-header bg-custom-blue text-white text-center fw-bold py-4 rounded-top-4 header-glow fs-2">
        Register Your New account
    </div>
        
    <div class="card-body bg-custom-gray p-5 p-md-5 rounded-bottom-4">
        <form action="{{ url_for('auth.register') }}" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row align-items-center">

                <div class="col-md-4 text-center mb-4">

                    <label for="photo-upload" class="photo-placeholder shadow-sm border-0" style="cursor: pointer;">
                        <svg id="placeholder-svg" xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#cecece"
                            class="bi bi-person-fill" viewBox="0 0 16 16">
                            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                        </svg>
                    </label>
                    <input type="file" id="photo-upload" name="picture" accept="image/*" class="d-none" onchange="previewImage(event)">

                    <div class="mt-2">
                        <label for="photo-upload" class="fw-bold text-dark fs-5" style="cursor: pointer;">Photo</label>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-bold text-dark mb-1">Full name</label>
                        <input 
                        type="text" 
                        class="form-control rounded-pill form-control-custom"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your fullname..."
                        value="{{ full_name or '' }}"
                        required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="phone_number" class="form-label fw-bold text-dark mb-1">Phone number</label>
                        <input 
                            type="text"  
                            class="form-control rounded-pill form-control-custom"
                            id="phone_number"
                            name="phone_number"
                            placeholder="Enter your phone number..."
                            value="{{ phone_number or '' }}"
                            required
                            >
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold text-dark mb-1">Username</label>
                        <input 
                            type="text" 
                            class="form-control rounded-pill form-control-custom"
                            id="username"
                            name="username" 
                            placeholder="Enter your username..."
                            value="{{ username or '' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold text-dark mb-1">Email</label>
                        <input 
                            type="email"
                            class="form-control rounded-pill form-control-custom"
                            id="email"
                            name="email" 
                            placeholder="Enter your email..."
                            value="{{ email or '' }}"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold text-dark mb-1">Password</label>
                        <input 
                            type="password" 
                            class="form-control rounded-pill form-control-custom"
                            id="password"
                            name="password" 
                            placeholder="Enter your password..."
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-bold text-dark mb-1">Confirm Password</label>
                        <input 
                            type="password"  
                            class="form-control rounded-pill form-control-custom"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password..."
                            required
                        >
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end align-items-center gap-3 mt-4">
                <a href="{{ url_for('auth.login') }}" class="btn btn-transparent-gray rounded-pill px-5 py-3 text-decoration-none fw-bold">
                    Already have an account?
                </a>
                <button type="submit" class="btn bg-custom-blue text-white rounded-pill px-5 py-2 fw-bold btn-glow fs-5">
                    Sign Up
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const placeholder = document.querySelector('.photo-placeholder');
            placeholder.innerHTML = `<img src="${e.target.result}" 
                                        class="rounded-circle shadow-sm" 
                                        style="width:150px; height:150px; object-fit:cover;">`;
        };
        reader.readAsDataURL(file);
    }
}
</script>

{% endblock %}
