{% extends "layouts/base.html" %}

{% block title %}Login{% endblock  %}

{% block content %}

<div class="card border-0 rounded-4 shadow-lg justify-content-center" >
        
    <div class="card-header bg-custom-blue text-white text-center fw-bold py-4 rounded-top-4 header-glow fs-2">
        Sign In
    </div>
        
    <div class="card-body bg-custom-gray p-5 rounded-bottom-4">
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label for="username" class="form-label fw-bold text-dark fs-5">Username</label>
                <input 
                type="text" 
                class="form-control form-control-lg rounded-pill form-control-custom fs-5" 
                id="username" 
                name="username"
                placeholder="Enter your username..."
                required
                autofocus
                >
            </div>
                
            <div class="mb-5">
                <label for="password" class="form-label fw-bold text-dark fs-5">Password</label>
                <input 
                type="password" 
                class="form-control form-control-lg rounded-pill form-control-custom fs-5" 
                id="password" 
                name="password"
                placeholder="Enter your password..."
                required
                >
            </div>
                
            <div class="d-flex justify-content-between align-items-center">
                <a href="{{ url_for('auth.register') }}" class="btn btn-transparent-gray rounded-pill px-5 py-3 text-decoration-none fw-bold">
                    Don't have an account?
                </a>
                    
                <button type="submit" class="btn bg-custom-blue text-white rounded-pill px-5 py-2 fw-bold btn-glow fs-5">
                    Login
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
