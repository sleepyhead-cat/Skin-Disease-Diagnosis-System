{% extends "layouts/base.html" %}
{% block title %}Delete User{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirm Delete</h5>
            </div> 
            <div class="card-body text-center">
                <div class="mb-3">
                    {% if user.picture %}
                        <img src="{{ url_for('static', filename='uploads/' ~ user.picture) }}"
                             alt="Profile Picture"
                             class="rounded-circle shadow-sm"
                             style="width:100px; height:100px; object-fit:cover;">
                    {% else %}
                        <img src="{{ url_for('static', filename='images/8358770.png') }}"
                             alt="Default Profile Picture"
                             class="rounded-circle shadow-sm"
                             style="width:100px; height:100px; object-fit:cover;">
                    {% endif %}
                </div>

                <p class="mt-3">
                    Are you sure you want to delete the user
                    <strong>{{ user.username }}</strong> ({{ user.full_name }})?
                </p>

                <form method="POST" action="{{ url_for('users.delete', user_id=user.id) }}">
                    {{ form.hidden_tag() }}

                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{{ url_for('users.detail', user_id=user.id) }}" class="btn btn-secondary">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
